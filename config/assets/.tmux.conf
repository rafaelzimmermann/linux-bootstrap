set -g prefix C-b
bind C-b send-prefix
bind r source-file ~/.tmux.conf

# Enable extended keys when supported by the installed tmux version.
set -gq extended-keys on
set -gq extended-keys-format csi-u

# ---- Mouse support (click windows/panes, scroll, drag to resize) ----
set -g mouse on

# ---- Automatic window naming: project[branch] ----
setw -g automatic-rename on
setw -g automatic-rename-format '#("$HOME/.tmux/window-name.sh" #{q:pane_current_path})'

# ---- Status bar: show all windows, highlight current ----
set -g status on
set -g status-interval 5
set -g status-justify left

# Status bar colors
set -g status-style "bg=colour234,fg=colour250"

# Left/right sections
set -g status-left-length 40
set -g status-right-length 80
set -g status-left  "#[bg=#{?client_prefix,colour226,colour33},fg=#{?client_prefix,black,white},bold] #{?client_prefix,PREFIX | ,}session:#S #[bg=colour234,fg=colour33] "
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=white,bold]%H:%M "

# Inactive windows
setw -g window-status-format " #I:#W#F "
setw -g window-status-style "bg=colour236,fg=colour250"

# Current (active) window — highlighted
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-current-style "bg=colour33,fg=white,bold"

# Windows with activity
setw -g monitor-activity on
setw -g window-status-activity-style "bg=colour208,fg=black"

# TPM and the Linux resource widgets remain available across machines.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true
set -g @dracula-show-battery false
set -g @dracula-show-flags true
set -g @dracula-network-bandwidth eth0
set -g @dracula-network-bandwidth-show-interface true
set -g @dracula-military-time true
set -g @dracula-show-location false
set -g @dracula-show-left-icon hostname
set -g @dracula-plugins "cpu-usage gpu-usage ram-usage"

if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'

# Pane borders
set -g pane-border-style "fg=colour238"
# Yellow indicates tmux is waiting for a command after the prefix key.
set -g pane-active-border-style "fg=#{?client_prefix,colour226,colour33}"
